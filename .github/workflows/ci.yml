name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: olympus
          POSTGRES_PASSWORD: olympus
          POSTGRES_DB: olympus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympus -d olympus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://olympus:olympus@localhost:5432/olympus
      OLYMPUS_ENV: test
      OLYMPUS_STORAGE_ROOT: ./var/olympus
      OLYMPUS_WORKSPACE_ROOT: ./var/olympus/workspaces
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: make lint
      - run: make typecheck
      - run: uv run alembic upgrade head
      - run: make test-unit
      - run: make test-persistence
      - run: make test-integration
      - run: make test-security
      - run: make test-git

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: olympus
          POSTGRES_PASSWORD: olympus
          POSTGRES_DB: olympus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympus -d olympus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://olympus:olympus@localhost:5432/olympus
      OLYMPUS_ENV: test
      OLYMPUS_STORAGE_ROOT: ./var/olympus
      OLYMPUS_WORKSPACE_ROOT: ./var/olympus/workspaces
      LLM_LIVE_TESTS: "1"
      MODEL_PROVIDER: openai
      MODEL_DEFAULT: gpt-5.4-mini
      MODEL_VERIFICATION: gpt-5.4-mini
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: make test-live
