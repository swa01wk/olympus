[project]
name = "olympus"
version = "0.0.0"
description = "Olympus MVP control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uuid6>=2024.7",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "anthropic>=1.11.0",
    "openai>=3.22.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "jinja2>=3.1.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "psycopg-pool>=3.3.3",
    "cryptography>=43.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
strict_markers = true
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "persistence: database and migration tests",
    "integration: multi-component tests without live LLM",
    "workflow: workflow-level tests",
    "git: git-backed tests",
    "connector: connector tests (mocked transport)",
    "connector_live: live connector tests",
    "security: security and boundary tests",
    "recovery: failure injection and recovery",
    "live_llm: tests requiring live LLM providers",
    "journey: full journey tests with live LLM",
    "e2e: end-to-end tests",
    "ui: dashboard UI tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "apps", "agents", "tests", "migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/control_api/**" = ["B008"]
"migrations/**" = ["E501"]
"core/runtime/**" = ["E501"]
"tests/unit/runtime/**" = ["E501"]
"tests/conftest.py" = ["E402"]
"scripts/demo/**" = ["E402"]
"tests/fixtures/repos/**" = ["B008", "E402"]
"core/intelligence/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["testcontainers.*", "anthropic.*", "openai.*", "langgraph.*", "langgraph_checkpoint_postgres.*", "docx.*", "pypdf.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["core.runtime.providers.*"]
disable_error_code = ["call-overload", "arg-type"]

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[[tool.mypy.overrides]]
module = "core.runtime.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "apps.control_api.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "apps.scheduler_worker.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "apps.execution_worker.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "agents.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["core", "apps", "agents"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "agents-no-persistence"
type = "forbidden"
source_modules = ["agents"]
forbidden_modules = ["core.db", "core.state", "core.commands", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "core-no-apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "connectors-only-via-gateway"
type = "forbidden"
source_modules = ["agents"]
forbidden_modules = ["core.integrations.connectors"]

[[tool.importlinter.contracts]]
name = "no-secrets-in-agents"
type = "forbidden"
source_modules = ["agents"]
forbidden_modules = ["core.integrations.connectors.secrets"]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "types-PyYAML>=6.0",
]
