# Phase 16 integration test profile (plan §12).
# Usage:
#   docker compose -f docker-compose.yml -f deploy/compose.test.yaml --profile integrations up -d
#
# Services:
#   gitea       — Git + issue tracker (http://localhost:3000)
#   minio       — S3-compatible artifact store (http://localhost:9000)
#   ci-runner   — minimal CI trigger + signed callback (http://localhost:8090)
#   fault-proxy — HTTP forwarder with injectable faults (http://localhost:9099)

services:
  gitea:
    profiles: ["integrations"]
    image: gitea/gitea:1.22.0-rootless
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA_ADMIN_USER: olympus
      GITEA_ADMIN_PASSWORD: olympus-integration
      GITEA_ADMIN_EMAIL: olympus@test.local
    ports:
      - "3000:3000"
    volumes:
      - gitea_data:/var/lib/gitea
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    profiles: ["integrations"]
    # minio/minio was removed from Docker Hub; same S3 API on port 9000.
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: olympus
      MINIO_ROOT_PASSWORD: olympus-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  ci-runner:
    profiles: ["integrations"]
    image: python:3.12-slim
    working_dir: /app/tests/support/ci_runner
    volumes:
      - .:/app
    command: >
      sh -c "pip install -q fastapi uvicorn httpx &&
      python -m uvicorn main:app --host 0.0.0.0 --port 8090"
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  fault-proxy:
    profiles: ["integrations"]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -q fastapi uvicorn httpx &&
      python -m uvicorn tests.support.fault_proxy:app --host 0.0.0.0 --port 9099"
    ports:
      - "9099:9099"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gitea_data:
  minio_data:
