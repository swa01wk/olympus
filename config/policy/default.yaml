version: 1
approvals_required:
  SCOPE: true
  ARCHITECTURE: true
  ARCHITECTURE_DELTA: true
  IMPLEMENTATION_SPEC: true
  SPEC_DELTA: true
  SPEC_DECISION: true
  REPAIR_SPEC: true
  PROMOTION: true
  FINDING_WAIVER: true
  RELEASE: true
  READINESS: false
execution:
  max_attempts: 3
  lease_ttl_s: 120
  heartbeat_s: 30
risk_tiers:
  R0: {}
  R1: {}
  R2:
    require_action_approval: [repository.merge_candidate]
  R3:
    require_action_approval: ["*mutating*"]
actions:
  version: 1
  deny:
    - match: {resource: repository, action: merge_candidate, actor_kind: AGENT}
    - match: {resource: release, action: "*", agent_profile_prefix: "forge."}
    - match: {resource: git, action: commit, protected_ref: true}
  protected_ref_patterns:
    - refs/heads/main
    - refs/heads/master
    - refs/heads/release/*
    - refs/heads/olympus/release/*
    - refs/tags/*
planning:
  max_tasks_per_plan: 12
index:
  max_parse_error_ratio: 0.5
  indexer_version: p07.1
  verify_incremental: true
impact:
  baseline_floor: IMPACTED_PLUS_SMOKE
  min_structural_seeds: 3
  min_semantic_threshold: 5
  max_items: 500
  max_lexical_candidates: 20
  max_semantic_candidates: 15
findings:
  blocking_severities: [BLOCKER, MAJOR]
  blocking_categories: [MERGE_CONFLICT, INTEGRATION_CHECK_FAILED, BASE_NOT_ANCESTOR_OF_CANONICAL]
readiness:
  principal_coverage: 0.8
  review_completion: 1.0
  baseline_coverage: 1.0
  baseline_pass: 1.0
  blocking_uncertainties_open: 0
  failing_existing_tests_unclassified: 0
  architecture_approved: 1.0
baselines:
  auto_activate_on_pass: true
promotion:
  recovered_spec_requires_human: true
brownfield:
  runtime_probes: safe_only
release:
  promote_acs_to_baselines: true
  eligibility_conditions:
    GREENFIELD_BUILD:
      - manifest_valid
      - integration_candidate_is_current
      - required_gates_pass
      - required_approvals_exist
      - required_executions_not_stale
      - blocking_findings
      - mandatory_acceptance_criteria_have_evidence
      - required_behavioral_baselines_pass
    BUG_FIX:
      - manifest_valid
      - integration_candidate_is_current
      - required_gates_pass
      - required_approvals_exist
      - required_executions_not_stale
      - blocking_findings
      - mandatory_acceptance_criteria_have_evidence
      - required_behavioral_baselines_pass
      - defect_reproduced_before_repair
      - original_reproduction_passes
      - regression_evidence_present
    default:
      - manifest_valid
      - integration_candidate_is_current
      - required_gates_pass
      - required_approvals_exist
      - required_executions_not_stale
      - blocking_findings
      - mandatory_acceptance_criteria_have_evidence
      - required_behavioral_baselines_pass
bugfix:
  reproduction_attempts: 3
  allow_unreproduced: false
  max_repair_files: 3
  graph_reach_depth: 4
assurance:
  auto_schedule_warden: true
  auto_schedule_sentinel: true
  use_deterministic_plan_fallback: true
  warden_review_required: true
  warden_unspecified_concern_as_finding: true
  required_gates:
    GREENFIELD_BUILD: [INTEGRATION, WARDEN, SENTINEL]
    BROWNFIELD_ONBOARDING: [INTEGRATION, SENTINEL, BASELINE]
    FEATURE_CHANGE: [INTEGRATION, WARDEN, SENTINEL, BASELINE]
    BUG_FIX: [INTEGRATION, REPRODUCTION, REGRESSION, WARDEN, SENTINEL, BASELINE]
    REMEDIATION: [INTEGRATION, SENTINEL, BASELINE]
    default: [INTEGRATION, WARDEN, SENTINEL, BASELINE]
repository:
  canonical_advance_on: INTEGRATION_READY
  materialization:
    max_size_mb: 512
    submodules: DENY
    lfs: DENY
    max_attempts: 3
  external_sync:
    adopt_fast_forward: true
    rewrite: REQUIRE_HUMAN_ACK
outbound:
  git:
    push_candidate_branches: true
  http_generic:
    allowed_hosts:
      - 127.0.0.1
      - localhost
    allow_unreconcilable: false
  retry:
    max_attempts: 5
    initial_backoff_s: 2
reconciliation:
  max_attempts: 8
  poll_repositories_minutes: 5
inbound:
  replay_window_s: 300
  ci:
    allow_unsolicited: false
